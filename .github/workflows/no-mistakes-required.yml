name: Require no-mistakes
run-name: 'PR #${{ github.event.pull_request.number }} body compliance - ${{ github.event.action }} - event ${{ github.run_number }} (run ${{ github.run_id }})'

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main
    # Never create a run for a release-please PR. The job-level author exemption
    # below cannot do this: it is evaluated inside a run, and a GITHUB_TOKEN PR's
    # run is created in action_required and never starts.
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md
      - package.json

permissions:
  contents: read

# GitHub concurrency groups retain at most one pending run, replacing older
# pending runs even when cancel-in-progress is false. Give body-bearing events
# an immutable per-event group so first-time-fork approvals can never collapse
# opened/edited checks. Keep synchronize/reopened coalescing as before.
concurrency:
  group: no-mistakes-required-${{ github.event.pull_request.number }}-${{ (github.event.action == 'opened' || github.event.action == 'edited') && github.run_id || 'head-change' }}
  cancel-in-progress: true

jobs:
  check:
    name: PR must be raised via no-mistakes
    runs-on: ubuntu-latest
    # Known automation accounts are exempt so the release pipeline keeps working:
    # - github-actions[bot] opens the release-please PR via GITHUB_TOKEN
    # - dependabot[bot] opens dependency update PRs
    # Other authors (human or bot) must raise PRs through `git push no-mistakes`.
    if: >-
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'release-please[bot]'
    steps:
      - name: Verify no-mistakes signature in PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          marker='Updates from [git push no-mistakes](https://github.com/kunchenguid/no-mistakes)'
          if ! printf '%s' "${PR_BODY:-}" | grep -qF -- "$marker"; then
            {
              echo "::error::This PR was not raised through no-mistakes."
              echo
              echo "Contributions to this repository must be submitted via 'git push no-mistakes'."
              echo "That pipeline runs the required review/test/lint/CI steps and writes a"
              echo "deterministic '## Pipeline' section into the PR body containing:"
              echo
              echo "    $marker"
              echo
              echo "See CONTRIBUTING.md for setup and the full workflow."
              echo
              echo "PR author: ${PR_AUTHOR}"
            } >&2
            exit 1
          fi
          echo "Found no-mistakes signature in PR #${PR_NUMBER} body."

          # Signature-only bodies from older no-mistakes are not enough: this
          # repo requires the v1 structured step attestation (>= 1.46.0).
          python3 - <<'PY'
          import json
          import os
          import sys

          PREFIX = "<!-- no-mistakes-pipeline-attestation:v1 "
          SUFFIX = " -->"
          REQUIRED_STEPS = ("review", "test", "document")

          body = os.environ.get("PR_BODY") or ""
          author = os.environ.get("PR_AUTHOR") or "unknown"


          def fail(lines):
              sys.stderr.write("::error::{}\n".format(lines[0]))
              if len(lines) > 1:
                  sys.stderr.write("\n")
                  sys.stderr.write("\n".join(lines[1:]))
                  sys.stderr.write("\n")
              sys.exit(1)


          def fail_missing_attestation():
              fail(
                  [
                      "This repository requires no-mistakes >= 1.46.0 (https://github.com/kunchenguid/no-mistakes/pull/670).",
                      "The PR body has the no-mistakes signature, but is missing a parseable",
                      "<!-- no-mistakes-pipeline-attestation:v1 ... --> comment with JSON head_sha and steps.",
                      "An older no-mistakes that only writes the signature line is not enough.",
                      "Upgrade to no-mistakes >= 1.46.0 and re-submit via 'git push no-mistakes'.",
                      "",
                      "See CONTRIBUTING.md for setup and the full workflow.",
                      "",
                      "PR author: {}".format(author),
                  ]
              )


          start = body.find(PREFIX)
          if start < 0:
              fail_missing_attestation()
          payload_start = start + len(PREFIX)
          end = body.find(SUFFIX, payload_start)
          if end < 0:
              fail_missing_attestation()
          payload = body[payload_start:end].strip()
          try:
              data = json.loads(payload)
          except json.JSONDecodeError:
              fail_missing_attestation()
          if not isinstance(data, dict):
              fail_missing_attestation()
          head_sha = data.get("head_sha")
          steps = data.get("steps")
          if not isinstance(head_sha, str) or not head_sha or not isinstance(steps, list):
              fail_missing_attestation()

          status_by_step = {}
          for item in steps:
              if not isinstance(item, dict):
                  fail_missing_attestation()
              name = item.get("step")
              status = item.get("status")
              if not isinstance(name, str) or not name:
                  fail_missing_attestation()
              if not isinstance(status, str) or not status:
                  status_by_step[name] = "missing"
                  continue
              status_by_step[name] = status

          incomplete = []
          for name in REQUIRED_STEPS:
              status = status_by_step.get(name, "missing")
              if status != "completed":
                  incomplete.append("{}={}".format(name, status))
          if incomplete:
              fail(
                  [
                      "Required no-mistakes pipeline steps are not completed: {}.".format(
                          ", ".join(incomplete)
                      ),
                      "This repository requires review, test, and document to have status=completed.",
                      "skipped, failed, pending, running, or missing steps fail this check.",
                      "Quota skips and agent skips are non-compliant.",
                      "Re-run 'git push no-mistakes' without skipping those steps.",
                      "",
                      "See CONTRIBUTING.md for setup and the full workflow.",
                      "",
                      "PR author: {}".format(author),
                  ]
              )

          print(
              "Pipeline attestation accepted for head {} (review, test, document completed).".format(
                  head_sha
              )
          )
          PY
